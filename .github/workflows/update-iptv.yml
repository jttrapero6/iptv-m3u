name: Update IPTV Playlist

# Ejecuta cada 6 horas
on:
  schedule:
    - cron: '0 */6 * * *'
  
  # También permite ejecutar manualmente desde GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download IPTV playlist
        run: |
          curl -f -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -o source.m3u "http://260084.solanaflix.com/get.php?username=TV-69606297&password=777456031244&type=m3u_plus"

      - name: Generate named playlists
        run: |
          jq -r '.[]' playlists.json | while IFS= read -r name; do
            cp source.m3u "${name}.m3u"
          done
          rm source.m3u

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          for name in $(jq -r '.[]' playlists.json); do
            git add -f "${name}.m3u"
          done
          git commit -m "Updated IPTV playlists at $(date)" || echo "No changes"
          git push